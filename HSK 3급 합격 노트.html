<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>HSK 3급 합격 노트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Serif+SC:wght@500;700&display=swap">
<style>
/* Layout: one narrow study column like an exercise book page; 田字格 squares carry the hanzi, a red seal marks finished work. */
:root{
  --paper:#F4F6F1; --sheet:#FFFFFF; --ink:#17221D; --muted:#5A6961; --line:#DAE2DA;
  --grid:#2B8560; --grid-ink:#FFFFFF; --grid-soft:#E1EEE6; --seal:#BF3A29; --seal-soft:#F6E2DD; --amber:#A86A12;
  --f-han:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E1411; --sheet:#16201B; --ink:#E3EAE5; --muted:#95A59C; --line:#27332C;
  --grid:#5BBE90; --grid-ink:#0E1411; --grid-soft:#1B2E24; --seal:#E26B5A; --seal-soft:#3A211C; --amber:#E1A647;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1411; --sheet:#16201B; --ink:#E3EAE5; --muted:#95A59C; --line:#27332C;
  --grid:#5BBE90; --grid-ink:#0E1411; --grid-soft:#1B2E24; --seal:#E26B5A; --seal-soft:#3A211C; --amber:#E1A647;
  color-scheme:dark}
[hidden]{display:none!important}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-ui);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--grid);outline-offset:2px}
.han{font-family:var(--f-han);font-weight:500}
.mono{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(88px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:14px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.3}
h2{font-size:17px;font-weight:600}
h3{font-size:15px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:500}

/* hero */
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:10px 0 4px;border-bottom:1.5px solid var(--ink)}
.hero .dday{font-family:var(--f-num);font-weight:600;font-size:46px;line-height:1;letter-spacing:-.02em}
.hero .exam{text-align:right;display:flex;flex-direction:column;gap:2px}
.hero .exam b{font-size:15px;font-weight:600}
.phase{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--grid-soft);color:var(--grid);white-space:nowrap}
.chip.red{background:var(--seal-soft);color:var(--seal)}
.chip.plain{background:transparent;border:1px solid var(--line);color:var(--muted)}

/* panels */
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;position:relative}
.task{overflow:hidden}
.task-head{display:flex;align-items:center;gap:10px}
.step{width:26px;height:26px;flex:none;display:grid;place-items:center;border:1.5px solid var(--grid);color:var(--grid);font-family:var(--f-num);font-weight:600;font-size:13px;position:relative}
.step::before,.step::after{content:"";position:absolute;opacity:.35}
.step::before{left:0;right:0;top:50%;border-top:1px dashed var(--grid)}
.step::after{top:0;bottom:0;left:50%;border-left:1px dashed var(--grid)}
.task-head h2{flex:1;min-width:0}
.time{font-size:12px;color:var(--muted);font-family:var(--f-num)}
.task .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px}
.task .meta b{font-family:var(--f-num);font-weight:600}
.btn{border:0;border-radius:8px;padding:11px 16px;font-weight:600;font-size:15px;background:var(--grid);color:var(--grid-ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.soft{background:var(--grid-soft);color:var(--grid)}
.btn.danger{background:var(--seal);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.grow{flex:1}
.seal{position:absolute;right:14px;top:12px;width:58px;height:58px;border:2.5px solid var(--seal);color:var(--seal);border-radius:6px;display:grid;place-items:center;font-family:var(--f-han);font-weight:700;font-size:20px;line-height:1;transform:rotate(-8deg);letter-spacing:.05em;background:color-mix(in srgb,var(--sheet) 70%,transparent);pointer-events:none}
.seal span{writing-mode:vertical-rl}
.task.done .time{visibility:hidden}
.task.done .btn{background:var(--grid-soft);color:var(--grid)}
.hint{font-size:13px;color:var(--muted);border-left:2px solid var(--line);padding-left:10px}

/* progress */
.bar{height:8px;background:var(--grid-soft);border-radius:999px;position:relative;overflow:visible}
.bar i{display:block;height:100%;background:var(--grid);border-radius:999px;max-width:100%}
.bar .mark{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:1px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted)}
.kv b{color:var(--ink);font-family:var(--f-num);font-weight:600}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .dow{font-size:11px;text-align:center;color:var(--muted)}
.cal .d{aspect-ratio:1;max-width:100%;border:1px solid var(--line);border-radius:4px;display:grid;place-items:center;font-size:11px;font-family:var(--f-num);color:var(--muted);position:relative;background:var(--sheet)}
.cal .d.half{background:linear-gradient(135deg,var(--grid-soft) 50%,var(--sheet) 50%);border-color:var(--grid)}
.cal .d.full{background:var(--grid);color:var(--grid-ink);border-color:var(--grid)}
.cal .d.today{outline:2px solid var(--ink);outline-offset:1px}
.cal .d.exam{border:2px solid var(--seal);color:var(--seal);font-family:var(--f-han);font-weight:700;font-size:13px}
.cal .d.pad{visibility:hidden}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:3px;border:1px solid var(--grid);display:inline-block}

/* 田字格 */
.tzrow{display:flex;justify-content:center;gap:0;flex-wrap:wrap}
.tz{--s:84px;width:var(--s);height:var(--s);border:1.5px solid var(--grid);margin-left:-1.5px;position:relative;display:grid;place-items:center;font-family:var(--f-han);font-weight:500;font-size:calc(var(--s)*.66);line-height:1;color:var(--ink);background:var(--sheet)}
.tz:first-child{margin-left:0}
.tz::before,.tz::after{content:"";position:absolute;pointer-events:none}
.tz::before{left:0;right:0;top:50%;border-top:1px dashed color-mix(in srgb,var(--grid) 55%,transparent)}
.tz::after{top:0;bottom:0;left:50%;border-left:1px dashed color-mix(in srgb,var(--grid) 55%,transparent)}
.tz span{position:relative;z-index:1}
.tz.sm{--s:44px}

/* session */
.sess-top{display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--paper);padding:8px 0;z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.iconbtn{width:44px;height:44px;border-radius:8px;border:1px solid var(--line);background:var(--sheet);display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}
.sess-top .bar{flex:1}
.count{font-family:var(--f-num);font-size:13px;color:var(--muted);min-width:52px;text-align:right}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:22px 16px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.card .py{font-family:var(--f-num);font-size:20px;color:var(--grid);font-weight:500}
.card .ko{font-size:19px;font-weight:600}
.ex{width:100%;text-align:left;border-top:1px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:3px}
.ex .zh{font-family:var(--f-han);font-size:20px;line-height:1.5}
.ex .zh mark{background:none;color:var(--grid);font-weight:700;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.ex .p{font-family:var(--f-num);font-size:12.5px;color:var(--muted);line-height:1.45}
.ex .k{font-size:14px}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grades button{border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:10px 6px;min-height:56px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:600}
.grades button small{font-weight:400;font-size:11.5px;color:var(--muted);font-family:var(--f-num)}
.grades .g0{border-color:var(--seal);color:var(--seal)}
.grades .g2{border-color:var(--grid);color:var(--grid)}
.newtag{font-size:11px;font-weight:600;color:var(--amber);letter-spacing:.04em}
.speak{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:6px 12px;font-size:13px;min-height:36px}
.speak svg{width:16px;height:16px}

/* questions */
.q{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px}
.q .part{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.04em}
.q .stmt{font-family:var(--f-han);font-size:21px;line-height:1.55}
.q .stmt .star{color:var(--seal);font-family:var(--f-ui);margin-right:4px}
.q .sent{font-family:var(--f-han);font-size:22px;line-height:1.7}
.q .passage{font-family:var(--f-han);font-size:19px;line-height:1.8}
.blank{display:inline-block;min-width:2.6em;border-bottom:2px solid var(--grid);text-align:center;color:var(--grid);font-weight:700;margin:0 2px}
.ruby{display:inline-flex;flex-direction:column;align-items:center;vertical-align:bottom;margin:0 2px}
.ruby small{font-family:var(--f-num);font-size:12px;color:var(--grid);line-height:1}
.ruby .tz{--s:44px;font-size:30px}
.opts{display:grid;gap:8px}
.opts.two{grid-template-columns:1fr 1fr}
.opts.four{grid-template-columns:1fr 1fr}
.opt{border:1.5px solid var(--line);background:var(--sheet);border-radius:8px;padding:12px;min-height:50px;text-align:left;display:flex;align-items:center;gap:10px;font-size:16px}
.opt .lt{font-family:var(--f-num);font-weight:600;color:var(--muted);flex:none}
.opt.hz{font-family:var(--f-han);font-size:22px;justify-content:center}
.opt.ok{border-color:var(--grid);background:var(--grid-soft)}
.opt.no{border-color:var(--seal);background:var(--seal-soft)}
.opt:disabled{cursor:default}
.play{width:72px;height:72px;border-radius:50%;border:0;background:var(--grid);color:var(--grid-ink);display:grid;place-items:center;align-self:center}
.play svg{width:30px;height:30px}
.fb{border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.fb.ok{background:var(--grid-soft)}
.fb.no{background:var(--seal-soft)}
.fb b{font-size:15px}
.fb .zh{font-family:var(--f-han);font-size:18px}
.fb .p{font-family:var(--f-num);font-size:12.5px;color:var(--muted)}
.tray{min-height:58px;border:1.5px dashed var(--grid);border-radius:8px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tray:empty::before{content:"아래 단어를 순서대로 누르세요";color:var(--muted);font-size:13px;padding-left:4px}
.tiles{display:flex;flex-wrap:wrap;gap:8px}
.tile{font-family:var(--f-han);font-size:19px;padding:8px 12px;border:1px solid var(--line);background:var(--sheet);border-radius:6px;min-height:44px}
.tile.used{visibility:hidden}
.tray .tile{background:var(--grid-soft);border-color:transparent}
.texttoggle{font-size:13px;color:var(--muted);text-decoration:underline;background:none;border:0;padding:4px;align-self:center}
.script{font-family:var(--f-han);font-size:17px;text-align:center}

/* lists */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.li:last-child{border-bottom:0}
.li .h{font-family:var(--f-han);font-size:20px;min-width:3.4em}
.li .m{flex:1;min-width:0;display:flex;flex-direction:column}
.li .m span{font-size:12.5px;color:var(--muted);font-family:var(--f-num)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;border:1.5px solid var(--line)}
.dot.s1{border-color:var(--amber);background:var(--amber)}
.dot.s2{border-color:var(--grid);background:var(--grid)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:6px 12px;font-size:13px;min-height:34px}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
input[type=search],input[type=number],input[type=text],select{font:inherit;color:var(--ink);background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px;width:100%}
.drills{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.drill{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:120px}
.drill .lab{font-size:11.5px;font-weight:600;color:var(--grid);letter-spacing:.03em}
.drill h3{font-size:16px}
.drill p{font-size:12.5px;color:var(--muted)}
.drill.wide{grid-column:1/-1;min-height:0;flex-direction:row;align-items:center}
.gitem{border-bottom:1px solid var(--line)}
.gitem:last-child{border-bottom:0}
.gitem>button{width:100%;background:none;border:0;padding:12px 2px;display:flex;align-items:center;gap:10px;text-align:left}
.gitem>button h3{flex:1;font-weight:500}
.gitem .body{padding:0 2px 14px;display:flex;flex-direction:column;gap:10px}
.pat{font-family:var(--f-ui);background:var(--grid-soft);color:var(--ink);padding:8px 10px;border-radius:6px;font-size:15px}
.gitem ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:2px;font-size:14px}
.chev{transition:transform .15s}
.gitem.open .chev{transform:rotate(90deg)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl td,.tbl th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font-weight:600;color:var(--muted);font-size:12px}
.tbl tr.now td{background:var(--grid-soft)}
.tbl .mono{white-space:nowrap}
.scroll{overflow-x:auto}
.scores .sc{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.scores .sc:last-child{border-bottom:0}
.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fields label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:2px;background:var(--sheet)}
.stat b{font-family:var(--f-num);font-size:22px;font-weight:600;line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}
.chart text{font-family:var(--f-num);font-size:10px;fill:var(--muted)}
.result{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;padding:24px 16px}
.result .big{font-family:var(--f-num);font-size:44px;font-weight:600;line-height:1}
.result .seal{position:static;transform:rotate(-8deg);width:72px;height:72px;font-size:24px}
.sheet-bg{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 40%,transparent);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--sheet);width:100%;max-width:560px;border-radius:14px 14px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;max-height:85vh;overflow:auto}
.notice{font-size:13px;background:var(--seal-soft);color:var(--ink);padding:10px 12px;border-radius:8px}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--sheet);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));z-index:20}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--muted);min-height:56px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--grid);font-weight:600}
@media (max-width:380px){.tz{--s:70px}.hero .dday{font-size:40px}.drills{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@keyframes stamp{from{transform:rotate(-8deg) scale(1.6);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:1}}
.seal.pop{animation:stamp .35s cubic-bezier(.2,.9,.3,1.2)}
</style>

<div class="app" id="app">
  <section class="view" id="v-today"></section>
  <section class="view" id="v-words" hidden></section>
  <section class="view" id="v-practice" hidden></section>
  <section class="view" id="v-grammar" hidden></section>
  <section class="view" id="v-records" hidden></section>
  <section class="view" id="v-session" hidden></section>
</div>
<div id="overlay"></div>

<nav class="tabs" id="tabs" aria-label="메뉴">
  <div class="in">
    <button data-tab="today" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4M9 15l2 2 4-4"/></svg>오늘</button>
    <button data-tab="words"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16"/><path d="M4 12h16M12 4v16" stroke-dasharray="2 2"/></svg>단어</button>
    <button data-tab="practice"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 4.5l4 4L9 19H5v-4z"/><path d="M13.5 6.5l4 4"/></svg>연습</button>
    <button data-tab="grammar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5C6.5 4.5 9.5 4.5 12 6c2.5-1.5 5.5-1.5 8-.5V19c-2.5-1-5.5-1-8 .5-2.5-1.5-5.5-1.5-8-.5z"/><path d="M12 6v13.5"/></svg>문법</button>
    <button data-tab="records"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20h16M7 16v-4M12 16V7M17 16v-6"/></svg>기록</button>
  </div>

māo.","우리 집에 고양이가 한 마리 있어요.",1],["只","zhǐ","단지, 오직, ~만","我只有十块钱。","wǒ zhǐ yǒu shí kuài qián.","10위안밖에 없어요.",1],["终于","zhōngyú","마침내, 드디어","我终于找到工作了。","wǒ zhōng yú zhǎo dào gōng zuò le.","드디어 일자리를 찾았어요.",0],["中间","zhōngjiān","가운데, 중간","坐在中间的人是我哥哥。","zuò zài zhōng jiān de rén shì wǒ gē ge.","가운데 앉은 사람이 우리 형이에요.",0],["种","zhǒng","종류, 가지","这种水果我没吃过。","zhè zhǒng shuǐ guǒ wǒ méi chī guò.","이런 과일은 먹어 본 적 없어요.",0],["重要","zhòngyào","중요하다","这件事很重要。","zhè jiàn shì hěn zhòng yào.","이 일은 중요해요.",0],["周末","zhōumò","주말","周末你做什么？","zhōu mò nǐ zuò shén me?","주말에 뭐 해요?",0],["主要","zhǔyào","주요하다; 주로","我主要是来学习的。","wǒ zhǔ yào shì lái xué xí de.","주로 공부하러 왔어요.",0],["祝","zhù","축원하다, 빌다","祝你生日快乐！","zhù nǐ shēng rì kuài lè!","생일 축하해요!",0],["注意","zhùyì","주의하다, 조심하다","天冷了，注意身体。","tiān lěng le, zhù yì shēn tǐ.","날이 추워졌으니 건강 조심하세요.",0],["字典","zìdiǎn","자전, 사전","我查了一下字典。","wǒ chá le yí xià zì diǎn.","사전을 찾아봤어요.",0],["自己","zìjǐ","자기, 스스로","这是我自己做的。","zhè shì wǒ zì jǐ zuò de.","이건 제가 직접 만든 거예요.",0],["总是","zǒngshì","늘, 언제나","他总是迟到。","tā zǒng shì chí dào.","그는 늘 지각해요.",0],["最近","zuìjìn","최근, 요즘","你最近忙吗？","nǐ zuì jìn máng ma?","요즘 바빠요?",0],["作业","zuòyè","숙제","我的作业写完了。","wǒ de zuò yè xiě wán le.","숙제 다 했어요.",0],["作用","zuòyòng","작용, 효과","这个药没有作用。","zhè ge yào méi yǒu zuò yòng.","이 약은 효과가 없어요.",0]],"G":[{"id":"le","t":"了 — 완료와 변화","w":0,"d":["동사 뒤 了: 동작이 끝났음을 나타내요.","문장 끝 了: 상황이 바뀌었음을 나타내요.","부정은 没(有) + 동사, 이때 了는 빼요."],"p":"동사 + 了 (+ 목적어) / 문장 + 了","ex":[["我昨天买了一件衬衫。","wǒ zuó tiān mǎi le yí jiàn chèn shān.","어제 셔츠 한 벌 샀어요."],["下雨了。","xià yǔ le.","비가 오기 시작했어요."],["我没看那个电影。","wǒ méi kàn nà ge diàn yǐng.","그 영화 안 봤어요."]]},{"id":"guo","t":"过 — 경험","w":0,"d":["'~한 적 있다'는 경험을 나타내요.","부정은 没 + 동사 + 过."],"p":"동사 + 过 (+ 목적어)","ex":[["我去过上海。","wǒ qù guò shàng hǎi.","상하이에 가 본 적 있어요."],["我没吃过这种水果。","wǒ méi chī guò zhè zhǒng shuǐ guǒ.","이런 과일은 먹어 본 적 없어요."],["你见过熊猫吗？","nǐ jiàn guò xióng māo ma?","판다 본 적 있어요?"]]},{"id":"zhe","t":"着 — 상태의 지속","w":1,"d":["'~해 있다, ~한 채로'처럼 상태가 계속되는 걸 나타내요.","장소 + 동사着 + 사물: '~에 ~이 있다'(존재문)."],"p":"동사 + 着","ex":[["门开着。","mén kāi zhe.","문이 열려 있어요."],["桌子上放着一杯咖啡。","zhuō zi shang fàng zhe yì bēi kā fēi.","책상 위에 커피 한 잔이 놓여 있어요."],["他笑着说：“你好！”","tā xiào zhe shuō: \"nǐ hǎo!\"","그는 웃으며 '안녕하세요!'라고 말했어요."]]},{"id":"bi","t":"比 — 비교","w":1,"d":["A 比 B + 형용사: A가 B보다 ~하다.","형용사 앞에 很·非常은 못 써요. 뒤에 一点儿 / 多了 / 得多를 붙여요.","부정: A 没有 B (那么) + 형용사."],"p":"A 比 B + 형용사 (+ 一点儿/多了)","ex":[["今天比昨天热。","jīn tiān bǐ zuó tiān rè.","오늘이 어제보다 더워요."],["他比我高一点儿。","tā bǐ wǒ gāo yì diǎnr.","그는 나보다 조금 커요."],["我没有他那么忙。","wǒ méi yǒu tā nà me máng.","나는 그 사람만큼 바쁘지 않아요."]]},{"id":"yiyang","t":"跟/和 … 一样 — 같다","w":1,"d":["A 跟 B 一样: A와 B가 같다.","뒤에 형용사를 붙이면 '똑같이 ~하다'.","부정은 不一样."],"p":"A 跟 B 一样 (+ 형용사)","ex":[["我的手机跟你的一样。","wǒ de shǒu jī gēn nǐ de yí yàng.","내 휴대폰은 네 거랑 같아."],["他和他哥哥一样聪明。","tā hé tā gē ge yí yàng cōng ming.","그는 형만큼 똑똑해요."]]},{"id":"shide","t":"是…的 — 이미 한 일 강조","w":1,"d":["이미 일어난 일의 시간·장소·방법·사람을 강조해요.","是는 생략할 수 있지만 的는 꼭 써요."],"p":"是 + 강조할 내용 + 동사 + 的","ex":[["你是什么时候来的？","nǐ shì shén me shí hou lái de?","언제 왔어요?"],["我是坐飞机来的。","wǒ shì zuò fēi jī lái de.","비행기 타고 왔어요."],["这本书是在图书馆借的。","zhè běn shū shì zài tú shū guǎn jiè de.","이 책은 도서관에서 빌린 거예요."]]},{"id":"ba","t":"把자문 — 무엇을 어떻게 처리했나","w":2,"d":["주어 + 把 + 목적어 + 동사 + 기타 성분.","동사만으로 끝나면 안 돼요. 了, 보어, 在…, 一下 등이 뒤에 와요.","부정어(没/不)와 조동사는 把 앞에 와요."],"p":"주어 + 把 + 목적어 + 동사 + 기타","ex":[["请把空调关了。","qǐng bǎ kōng tiáo guān le.","에어컨 좀 꺼 주세요."],["我把作业写完了。","wǒ bǎ zuò yè xiě wán le.","숙제를 다 했어요."],["他把书放在桌子上了。","tā bǎ shū fàng zài zhuō zi shang le.","그는 책을 책상 위에 놓았어요."]]},{"id":"bei","t":"被자문 — 피동","w":2,"d":["당한 쪽 + 被 + 한 사람 + 동사 + 기타 성분.","주로 원하지 않은 일에 많이 써요.","한 사람은 생략 가능: 被人 / 被."],"p":"A + 被 + B + 동사 + 기타","ex":[["我的蛋糕被弟弟吃了。","wǒ de dàn gāo bèi dì di chī le.","내 케이크를 남동생이 먹어 버렸어요."],["自行车被人骑走了。","zì xíng chē bèi rén qí zǒu le.","누가 자전거를 타고 가 버렸어요."]]},{"id":"jieguo","t":"결과보어 — 동작의 결과","w":2,"d":["동사 뒤에 完·好·到·见·懂·错·清楚 등을 붙여 결과를 나타내요.","부정: 没 + 동사 + 결과보어."],"p":"동사 + 完/好/到/懂/错…","ex":[["我听懂了。","wǒ tīng dǒng le.","알아들었어요."],["你找到护照了吗？","nǐ zhǎo dào hù zhào le ma?","여권 찾았어요?"],["我写错了一个字。","wǒ xiě cuò le yí gè zì.","글자 하나를 잘못 썼어요."]]},{"id":"fangxiang","t":"방향보어 — 어느 쪽으로","w":2,"d":["동사 + 来(말하는 사람 쪽) / 去(반대쪽).","上·下·进·出·回·过·起 + 来/去로 복합해서 써요."],"p":"동사 + (上/下/进/出/回) + 来/去","ex":[["你快下来吧。","nǐ kuài xià lái ba.","빨리 내려와."],["他从办公室走出来了。","tā cóng bàn gōng shì zǒu chū lái le.","그가 사무실에서 걸어 나왔어요."],["请把书拿回去。","qǐng bǎ shū ná huí qù.","책을 도로 가져가세요."]]},{"id":"yuelaiyue","t":"越来越 / 越A越B — 점점","w":3,"d":["越来越 + 형용사: 점점 ~해지다.","越 A 越 B: A할수록 B하다."],"p":"越来越 + 형용사 / 越 A 越 B","ex":[["天气越来越冷了。","tiān qì yuè lái yuè lěng le.","날씨가 점점 추워져요."],["雨越下越大。","yǔ yuè xià yuè dà.","비가 내릴수록 세져요."],["你越说我越不明白。","nǐ yuè shuō wǒ yuè bù míng bai.","네가 말할수록 더 모르겠어."]]},{"id":"suiran","t":"虽然…但是 — 비록 ~지만","w":3,"d":["앞 절은 사실을 인정하고, 뒤 절에서 반대 내용을 말해요.","但是 대신 可是도 써요. 뒤 절에 还是·也를 같이 쓰기도 해요."],"p":"虽然 A，但是 B","ex":[["虽然下雨了，但是我们还是去了。","suī rán xià yǔ le, dàn shì wǒ men hái shì qù le.","비가 왔지만 우리는 그래도 갔어요."],["他虽然很年轻，但是很有办法。","tā suī rán hěn nián qīng, dàn shì hěn yǒu bàn fǎ.","그는 젊지만 수완이 좋아요."]]},{"id":"ruguo","t":"如果…就 — 만약 ~라면","w":3,"d":["如果 A (的话)，(주어) 就 B.","就는 주어 뒤, 동사 앞에 와요."],"p":"如果 A，(주어) 就 B","ex":[["如果你有时间，就来我家玩儿吧。","rú guǒ nǐ yǒu shí jiān, jiù lái wǒ jiā wánr ba.","시간 있으면 우리 집에 놀러 와요."],["如果明天不下雨，我们就去爬山。","rú guǒ míng tiān bú xià yǔ, wǒ men jiù qù pá shān.","내일 비가 안 오면 등산 가요."]]},{"id":"yibian","t":"一边…一边 — ~하면서","w":3,"d":["두 동작을 동시에 할 때 써요.","주어는 맨 앞에 한 번만."],"p":"주어 + 一边 A + 一边 B","ex":[["他一边走一边打电话。","tā yì biān zǒu yì biān dǎ diàn huà.","그는 걸으면서 전화해요."],["我喜欢一边喝咖啡一边看书。","wǒ xǐ huan yì biān hē kā fēi yì biān kàn shū.","커피 마시면서 책 읽는 걸 좋아해요."]]},{"id":"chule","t":"除了…以外 — 제외 / 추가","w":4,"d":["除了 A 以外，都…: A만 빼고 다 (제외).","除了 A 以外，还/也…: A 말고 또 (추가).","以外는 생략할 수 있어요."],"p":"除了 A (以外)，都/还/也 …","ex":[["除了他以外，我们都去了。","chú le tā yǐ wài, wǒ men dōu qù le.","그 사람 빼고 우리는 다 갔어요."],["除了汉语以外，我还学英语。","chú le hàn yǔ yǐ wài, wǒ hái xué yīng yǔ.","중국어 말고 영어도 배워요."]]},{"id":"zhiyou","t":"只有…才 — ~해야만","w":4,"d":["유일한 조건: A해야만 비로소 B할 수 있다.","才는 동사 앞, 주어 뒤에 와요."],"p":"只有 A，才 B","ex":[["只有努力学习，才能考好。","zhǐ yǒu nǔ lì xué xí, cái néng kǎo hǎo.","열심히 공부해야만 시험을 잘 볼 수 있어요."],["只有周末我才有时间。","zhǐ yǒu zhōu mò wǒ cái yǒu shí jiān.","주말에만 시간이 있어요."]]},{"id":"you","t":"又…又 — ~하고 또 ~하다","w":4,"d":["두 가지 성질이나 동작이 함께 있을 때 써요.","보통 둘 다 좋은 뜻이거나 둘 다 나쁜 뜻이에요."],"p":"又 A 又 B","ex":[["这个房间又干净又安静。","zhè ge fáng jiān yòu gān jìng yòu ān jìng.","이 방은 깨끗하고 조용해요."],["他又会唱歌又会跳舞。","tā yòu huì chàng gē yòu huì tiào wǔ.","그는 노래도 하고 춤도 출 줄 알아요."]]},{"id":"xianzai","t":"先…再/然后 — 먼저 ~하고 나서","w":4,"d":["동작의 순서를 나타내요.","先 A，再 B / 先 A，然后 B."],"p":"先 A，再 / 然后 B","ex":[["你先休息一下，再写作业吧。","nǐ xiān xiū xi yí xià, zài xiě zuò yè ba.","먼저 좀 쉬고 나서 숙제해."],["我们先去银行，然后去超市。","wǒ men xiān qù yín háng, rán hòu qù chāo shì.","먼저 은행에 가고 그다음에 슈퍼에 가요."]]},{"id":"keneng","t":"가능보어 — 할 수 있다/없다","w":5,"d":["동사 + 得 + 보어: ~할 수 있다.","동사 + 不 + 보어: ~할 수 없다. 시험에는 부정형이 더 많이 나와요."],"p":"동사 + 得/不 + 결과·방향보어","ex":[["我听不懂。","wǒ tīng bù dǒng.","못 알아듣겠어요."],["这么多作业，你做得完吗？","zhè me duō zuò yè, nǐ zuò de wán ma?","숙제가 이렇게 많은데 다 할 수 있어요?"],["太远了，我看不清楚。","tài yuǎn le, wǒ kàn bù qīng chu.","너무 멀어서 잘 안 보여요."]]},{"id":"degree","t":"정도보어 得 — 얼마나 잘/빨리","w":5,"d":["동사 + 得 + 평가: 동작이 어떤 정도인지 말해요.","목적어가 있으면 동사를 한 번 더 쓰거나 목적어를 앞으로 보내요."],"p":"(동사 + 목적어) + 동사 + 得 + 평가","ex":[["他跑得很快。","tā pǎo de hěn kuài.","그는 빨리 달려요."],["她说汉语说得很好。","tā shuō hàn yǔ shuō de hěn hǎo.","그녀는 중국어를 잘해요."],["你昨天睡得怎么样？","nǐ zuó tiān shuì de zěn me yàng?","어제 잘 잤어요?"]]},{"id":"caijiu","t":"才 vs 就 — 늦게 / 일찍","w":5,"d":["就: 예상보다 이르거나 쉽게 이루어졌을 때.","才: 예상보다 늦거나 어렵게 이루어졌을 때."],"p":"시간 + 就/才 + 동사","ex":[["他七点就来了。","tā qī diǎn jiù lái le.","그는 7시에 벌써 왔어요."],["他十点才来。","tā shí diǎn cái lái.","그는 10시에야 왔어요."]]},{"id":"yijiu","t":"一…就 — ~하자마자","w":5,"d":["A가 일어나면 바로 B가 일어나요.","습관(~하기만 하면)에도 써요."],"p":"一 A 就 B","ex":[["我一到家就睡觉了。","wǒ yí dào jiā jiù shuì jiào le.","집에 오자마자 잤어요."],["他一看书就想睡觉。","tā yí kàn shū jiù xiǎng shuì jiào.","그는 책만 보면 졸려요."]]},{"id":"haishi","t":"还是 vs 或者 — 아니면 / 또는","w":6,"d":["의문문에서 '아니면'은 还是.","평서문에서 '또는'은 或者."],"p":"A 还是 B？ / A 或者 B","ex":[["你喝茶还是喝咖啡？","nǐ hē chá hái shì hē kā fēi?","차 마실래요, 아니면 커피?"],["我周末看书或者看电影。","wǒ zhōu mò kàn shū huò zhě kàn diàn yǐng.","주말에는 책을 보거나 영화를 봐요."]]},{"id":"weile","t":"为了 — ~을 위하여","w":6,"d":["목적을 나타내요. 보통 문장 앞에 와요."],"p":"为了 + 목적，…","ex":[["为了身体健康，他每天锻炼。","wèi le shēn tǐ jiàn kāng, tā měi tiān duàn liàn.","건강을 위해 그는 매일 운동해요."],["为了参加比赛，她练习了很久。","wèi le cān jiā bǐ sài, tā liàn xí le hěn jiǔ.","시합에 나가려고 그녀는 오래 연습했어요."]]},{"id":"dedede","t":"的·得·地 구분","w":6,"d":["的 + 명사: 我的书.","동사 + 得 + 보어: 说得很快.","형용사/부사 + 地 + 동사: 慢慢地走."],"p":"的 + 명사 / 동사 + 得 / ~地 + 동사","ex":[["这是我的书。","zhè shì wǒ de shū.","이건 내 책이에요."],["他说得很快。","tā shuō de hěn kuài.","그는 말이 빨라요."],["他慢慢地走过来了。","tā màn màn de zǒu guò lái le.","그가 천천히 걸어왔어요."]]},{"id":"shiliang","t":"시간·횟수 보어","w":6,"d":["동사 + 了 + 기간 (+ 목적어): 얼마 동안 했는지.","동사 + 횟수(次/遍): 몇 번 했는지."],"p":"동사 + 了 + 기간/횟수","ex":[["我等了你一个小时。","wǒ děng le nǐ yí gè xiǎo shí.","너를 한 시간 기다렸어."],["这个电影我看了三遍。","zhè ge diàn yǐng wǒ kàn le sān biàn.","이 영화를 세 번 봤어요."],["我学了两年汉语了。","wǒ xué le liǎng nián hàn yǔ le.","중국어를 2년째 배우고 있어요."]]}],"O":[{"a":"我把作业写完了。","c":["我","把","作业","写完了"],"g":["ba"],"alt":[],"py":"wǒ bǎ zuò yè xiě wán le."},{"a":"请把门关上。","c":["请","把","门","关上"],"g":["ba"],"alt":[],"py":"qǐng bǎ mén guān shàng."},{"a":"他把我的照相机借走了。","c":["他","把","我的照相机","借走了"],"g":["ba"],"alt":[],"py":"tā bǎ wǒ de zhào xiàng jī jiè zǒu le."},{"a":"你把护照放在哪儿了？","c":["你","把护照","放在","哪儿了"],"g":["ba"],"alt":[],"py":"nǐ bǎ hù zhào fàng zài nǎr le?"},{"a":"他把房间打扫得很干净。","c":["他","把房间","打扫得","很干净"],"g":["ba","degree"],"alt":[],"py":"tā bǎ fáng jiān dǎ sǎo de hěn gān jìng."},{"a":"我的自行车被弟弟骑走了。","c":["我的自行车","被","弟弟","骑走了"],"g":["bei"],"alt":[],"py":"wǒ de zì xíng chē bèi dì di qí zǒu le."},{"a":"蛋糕被孩子们吃完了。","c":["蛋糕","被","孩子们","吃完了"],"g":["bei"],"alt":[],"py":"dàn gāo bèi hái zi men chī wán le."},{"a":"今天比昨天冷多了。","c":["今天","比","昨天","冷多了"],"g":["bi"],"alt":["昨天比今天冷多了。"],"py":"jīn tiān bǐ zuó tiān lěng duō le."},{"a":"我妹妹没有我高。","c":["我妹妹","没有","我","高"],"g":[ /* ---------- DRILLS ---------- */

}
function progressChart() {
  const s = dn(START), e = dn(EXAM), W0 = 330, H0 = 170, L = 34, R = 10, Tp = 10, B = 24;
  const x = n => L + (n - s) / (e - s) * (W0 - L - R), y = v => Tp + (1 - v / 300) * (H0 - Tp - B);
  let grid = '';
  [0, 100, 200, 300].forEach(v => grid += `<line x1="${L}" x2="${W0 - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${y(v) + 3}" text-anchor="end">${v}</text>`);
  ['2026-10-21', '2026-11-09', '2026-11-30', '2026-12-13'].forEach(d => grid += `<text x="${x(dn(d))}" y="${H0 - 6}" text-anchor="middle">${md(d)}</text>`);
  let tgt = ''; for (let n = s; n <= e; n++) tgt += (n === s ? 'M' : 'L') + x(n).toFixed(1) + ' ' + y(targetWords(fromDn(n))).toFixed(1);
  let act = '', last = 0, pts = [];
  for (let n = s; n <= Math.min(T, e); n++) { const dd = S.days[fromDn(n)]; if (dd && dd.L != null) last = dd.L; pts.push([x(n), y(last)]); }
  if (pts.length) act = 'M' + pts.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('L');
  const lp = pts[pts.length - 1];
  return `<svg class="chart" viewBox="0 0 ${W0} ${H0}" width="100%" role="img" aria-label="단어 진도 그래프: 현재 ${last}개">
    ${grid}
    ${T >= s && T <= e ? `<line x1="${x(T)}" x2="${x(T)}" y1="${Tp}" y2="${H0 - B}" stroke="var(--muted)" stroke-opacity=".5" stroke-dasharray="2 3"/>` : ''}
    <path d="${tgt}" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 4"/>
    ${act ? `<path d="${act} L${lp[0].toFixed(1)} ${y(0)} L${x(s)} ${y(0)} Z" fill="var(--grid-soft)" stroke="none"/><path d="${act}" fill="none" stroke="var(--grid)" stroke-width="2.2" stroke-linejoin="round"/><circle cx="${lp[0]}" cy="${lp[1]}" r="4" fill="var(--grid)"/>` : ''}
  </svg>`;
}

/* ---------- sheet & toast ---------- */
function openSheet(html) { $('#overlay').innerHTML = `<div class="sheet-bg" data-act="closesheet-bg"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`; }
function closeSheet() { $('#overlay').innerHTML = ''; }
let toastT;
function toast(msg) {
  let el = $('#toast');
  if (!el) { el = document.createElement('div'); el.id = 'toast'; el.setAttribute('role', 'status'); el.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-size:14px;z-index:40;max-width:calc(100% - 32px)'; document.body.appendChild(el); }
  el.textContent = msg; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 2200);
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'closesheet-bg') { if (e.target === b) closeSheet(); return; }
  switch (act) {
    case 'words': startWords(false); break;
    case 'morewords': { const d = day(); d.x = (d.x || 0) + 8; commit(); closeSheet(); SESSION = null; startWords(true); break; }
    case 'flip': SESSION.flip = true; renderSession(); speak(W[SESSION.q[SESSION.pos].i][0]); break;
    case 'grade': gradeWord(b.dataset.g === 'known' ? 'known' : Number(b.dataset.g)); break;
    case 'close': SESSION = null; if (window.speechSynthesis) speechSynthesis.cancel(); show(TAB); window.scrollTo(0, 0); break;
    case 'say': speak(b.dataset.t); break;
    case 'today-skill': startToday(); break;
    case 'gweek': { const wk = WEEKS[weekIdx(TODAY)]; OPEN_G = wk.g[0] || null; show('grammar'); window.scrollTo(0, 0); break; }
    case 'drill': startDrill(b.dataset.t); break;
    case 'again': { const s = SESSION; startDrill(s.type, s.fixed ? { qs: shuffle(s.qs.map(q => qFromId(q.id))), title: s.title } : { n: s.qs.length, title: s.title }); break; }
    case 'ans': answer(b.dataset.v); break;
    case 'next': nextQ(); break;
    case 'showtext': SESSION.textShown = true; renderSession(); break;
    case 'pick': { const q = SESSION.qs[SESSION.pos], k = Number(b.dataset.k); if (!q.picked.includes(k)) q.picked.push(k); renderSession(); break; }
    case 'unpick': { const q = SESSION.qs[SESSION.pos]; q.picked.splice(Number(b.dataset.j), 1); renderSession(); break; }
    case 'clearpick': SESSION.qs[SESSION.pos].picked = []; renderSession(); break;
    case 'wf': WFILTER = b.dataset.f; renderWords(); break;
    case 'wdetail': wordSheet(Number(b.dataset.i)); break;
    case 'closesheet': closeSheet(); break;
    case 'relearn': { const i = Number(b.dataset.i), c = S.cards[i]; S.cards[i] = [1, T + 1, c ? c[2] : 0]; commit(); wordSheet(i); renderTab(); toast('내일 복습에 넣었어요.'); break; }
    case 'markknown': { const i = Number(b.dataset.i), c = S.cards[i]; S.cards[i] = [6, T + 30, c ? c[2] + 1 : 1]; commit(); wordSheet(i); renderTab(); toast('아는 단어로 표시했어요.'); break; }
    case 'gopen': OPEN_G = OPEN_G === b.dataset.g ? null : b.dataset.g; renderGrammar(); break;
    case 'gquiz': { const id = b.dataset.g, g = G.find(x => x.id === id); const qs = shuffle(D.O.map((o, k) => ({ o, k })).filter(x => x.o.g.includes(id))).map(x => qFromId('O:' + x.k)); startDrill('order', { qs, title: g.t.split(' — ')[0] + ' 확인 문제' }); break; }
    case 'addscore': {
      const v = id => { const n = Number($(id).value); return $(id).value === '' || isNaN(n) ? null : Math.round(n); };
      const l = v('#sc-l'), r = v('#sc-r'), w = v('#sc-w');
      if ([l, r, w].some(x => x == null || x < 0 || x > 100)) { $('#sc-msg').textContent = '세 영역 모두 0~100 사이 숫자로 적어 주세요.'; break; }
      S.scores.push({ d: TODAY, l, r, w, note: $('#sc-n').value.trim().slice(0, 30) }); commit(); renderRecords(); toast('점수를 저장했어요.'); break;
    }
    case 'delscore': S.scores.splice(Number(b.dataset.i), 1); commit(); renderRecords(); break;
    case 'reset1': RESET_ARMED = true; renderRecords(); break;
    case 'reset0': RESET_ARMED = false; renderRecords(); break;
    case 'reset2': { const set = S.set; S = blank(); S.set = set; RESET_ARMED = false; commit(); renderRecords(); toast('기록을 지웠어요.'); break; }
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'wq') { WQUERY = e.target.value; fillWordList(); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'set-n') { S.set.n = Number(e.target.value); commit(); toast('하루 새 단어를 ' + S.set.n + '개로 바꿨어요.'); }
  if (e.target.id === 'set-rate') { S.set.rate = Number(e.target.value); commit(); speak('你好，我们一起学习汉语吧。'); }
});
document.querySelectorAll('#tabs button').forEach(b => b.addEventListener('click', () => { closeSheet(); show(b.dataset.tab); window.scrollTo(0, 0); }));
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if ($('#overlay').innerHTML) closeSheet(); }
  if (!SESSION || e.target.matches('input,select,textarea')) return;
  if (SESSION.kind === 'words' && !SESSION.done) {
    if (!SESSION.flip && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); SESSION.flip = true; renderSession(); }
    else if (SESSION.flip && ['1', '2', '3'].includes(e.key)) gradeWord(Number(e.key) - 1);
  } else if (SESSION.kind === 'drill' && SESSION.answered && e.key === 'Enter') { e.preventDefault(); nextQ(); }
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { const prev = TODAY; tick(); if (prev !== TODAY && !SESSION) renderTab(); pullRemote(); } });

show('today');
initCloud();
</script>
